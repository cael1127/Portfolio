[build]
  publish = "build"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

## Redirects
# SPA catch-all is handled by `public/_redirects`.
# We intentionally do not add self-rewrite rules for `/sitemap.xml` or `/robots.txt` here.

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[dev]
  command = "npm start"
  port = 3000
  publish = "build"
  functions = "netlify/functions"

# Cache static assets aggressively
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Allow embedding the resume PDF within the site (used by /resume).
# The global X-Frame-Options=DENY would otherwise block <object>/<iframe> embeds.
[[headers]]
  for = "/Cael_Findley_Resume.pdf"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"